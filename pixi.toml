[workspace]
authors = ["Youssef Harby <yharby@walkthru.earth>"]
channels = ["conda-forge"]
name = "m5stack-aq-parquet"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
# --- device safety, read-only unless named otherwise ---
# Which serial ports exist. Run before anything that touches the board.
ports = "python -m serial.tools.list_ports -v"
# Confirm you are talking to an ESP32-S3 and not another board. Read-only.
chip = "esptool --chip esp32s3 chip-id"
flash-id = "esptool --chip esp32s3 flash-id"
mac = "esptool --chip esp32s3 read-mac"
# Read-only eFuse dump. Confirms flash type, wafer revision and that no
# secure-boot or flash-encryption fuse has been burned.
efuse = "espefuse summary"
# Full 16 MB flash image before the first write. This is the anti-brick step.
# Do NOT add a high --baud here. Measured on CoreS3 over USB-Serial/JTAG, the
# esptool default read the whole 16 MB in 97 s, while --baud 921600 aborted
# partway with "Serial data stream stopped, possible serial noise or corruption".
backup = { cmd = "mkdir -p backup && esptool --chip esp32s3 read-flash 0 0x1000000 backup/cores3-flash-$(date -u +%Y%m%dT%H%M%SZ).bin" }
# Restore a backup taken above. Destructive, pass the file explicitly.
restore = "esptool --chip esp32s3 write-flash 0"
# Show the partition table of a saved backup image. Read-only, pass the file.
backup-partitions = "python tools/read_partitions.py"
# Read the board's serial output for a bounded time, then stop. Never writes
# to flash. Pass --port and --seconds, see the script for the full options.
capture = "python tools/capture_serial.py"
# Interactive serial terminal. Pass the port and baud, for example
# pixi run monitor /dev/cu.usbmodem101 115200
monitor = "python -m serial.tools.miniterm --raw"

# --- host code quality ---
fmt = "clang-format -i $(git ls-files '*.c' '*.h' '*.cpp' '*.hpp' 2>/dev/null)"
fmt-check = "clang-format --dry-run --Werror $(git ls-files '*.c' '*.h' '*.cpp' '*.hpp' 2>/dev/null)"
lint = "cppcheck --enable=warning,style,performance,portability --inline-suppr --error-exitcode=1 --std=c++23 firmware"
hooks = "pre-commit install"

[dependencies]
cmake = ">=4.4.3,<5"
ninja = ">=1.13.2,<2"
ccache = ">=4.14,<5"
python = ">=3.14.7,<3.15"
git = ">=2.55.0,<3"
esptool = ">=5.3.1,<6"
rust = ">=1.98.0,<1.99"
clang-tools = ">=23.1.0,<24"
pip = ">=26.2.1,<27"
pyserial = ">=3.5,<4"
cppcheck = ">=2.21.0,<3"
pre-commit = ">=4.6.2,<5"

[activation.env]
# Firmware SDKs are large and are not conda packages, so the project bootstraps
# them itself into one pinned cache that every git worktree shares. Override
# this to relocate them. Nothing here is ever written inside the repo.
M5_TOOLCHAIN_ROOT = "$HOME/.cache/m5stack-aq-parquet/toolchains"
